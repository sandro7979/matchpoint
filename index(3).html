<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MatchPoint</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#020b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
.app{min-height:100vh;background:#020b0e;padding-bottom:108px}
.hero{
  position:relative;
  width:100%;
  height:calc(100vh - 108px);
  min-height:760px;
  max-height:1100px;
  background-image:linear-gradient(to bottom,rgba(0,0,0,.02) 42%,rgba(2,11,14,.35) 63%,#020b0e 82%),url("matchpoint-home.jpg");
  background-size:cover;
  background-position:center top;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.brand{
  margin-top:min(47vh,500px);
  text-align:center;
  position:relative;
  z-index:2;
}
.logo-mark{font-size:58px;line-height:.8;color:#d8ff00;margin-bottom:14px}
.logo{font-size:clamp(42px,9vw,72px);font-weight:900;letter-spacing:-2px;line-height:1}
.logo span{color:#d8ff00}
.tagline{font-size:clamp(16px,3.8vw,25px);letter-spacing:.4px;margin-top:12px}
.line{width:62px;height:3px;background:#d8ff00;margin:22px auto 42px;border-radius:4px}
.main-cta{
  width:min(86%,720px);height:86px;border:0;border-radius:48px;
  background:#d8ff00;color:#050909;font-size:clamp(19px,4.5vw,30px);font-weight:900;
  display:flex;align-items:center;justify-content:space-between;padding:0 48px;
  cursor:pointer;box-shadow:none;position:relative;z-index:5;
}
.main-cta .racket{font-size:35px}
.main-cta .arrow{font-size:42px;font-weight:400}
.bottom-nav{
  position:fixed;z-index:100;left:0;right:0;bottom:0;height:108px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(2,11,14,.98);border-top:1px solid rgba(255,255,255,.13);
  display:grid;grid-template-columns:repeat(3,1fr);
}
.nav-btn{
  border:0;background:transparent;color:#c8ced0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;font-size:18px;font-weight:700;padding:8px 4px;
}
.nav-btn .icon{font-size:39px;line-height:1}
.nav-btn.active{color:#d8ff00}
.view{display:none;min-height:calc(100vh - 108px);padding:42px 22px 130px;background:#020b0e}
.view.active{display:block}
.view h1{font-size:32px;margin:10px 0 28px}
.card{background:#0b171b;border:1px solid #203238;border-radius:20px;padding:24px;margin-bottom:16px}
.back{
  border:1px solid #39484d;background:#101c20;color:#fff;border-radius:14px;
  padding:13px 20px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:25px
}
.form-row{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.form-row label{font-weight:700}
.form-row input,.form-row select{
  width:100%;padding:15px;border-radius:12px;border:1px solid #34464c;
  background:#071216;color:#fff;font-size:17px
}
.action{
  width:100%;border:0;border-radius:14px;background:#d8ff00;color:#050909;
  padding:16px;font-size:18px;font-weight:900;cursor:pointer
}
@media(max-width:600px){
 .hero{height:calc(100vh - 108px);min-height:0;max-height:none;background-position:center top}
 .brand{margin-top:56vh}
 .logo-mark{font-size:46px}
 .line{margin:15px auto 30px}
 .main-cta{height:80px;padding:0 30px}
 .bottom-nav{height:108px}
 .nav-btn{font-size:17px}
 .nav-btn .icon{font-size:36px}
}
@media(min-width:800px){
 .hero{height:calc(100vh - 108px)}
}
</style>
</head>
<body>
<div class="app">

<section id="home" class="hero">
  <div class="brand">
    <div class="logo-mark">◉</div>
    <div class="logo">MATCH<span>POINT</span></div>
    <div class="tagline">TROVA IL TUO COMPAGNO DI TENNIS</div>
    <div class="line"></div>
  </div>

  <button class="main-cta" type="button" onclick="showView('match')">
    <span class="racket">🎾</span>
    <span>TROVA IL MIO MATCH</span>
    <span class="arrow">→</span>
  </button>
</section>

<section id="match" class="view">
  <button class="back" type="button" onclick="showView('home')">← Torna alla Home</button>
  <h1>Trova il mio match</h1>
  <div class="card">
    <div class="form-row"><label>Quando vuoi giocare?</label><input type="date"></div>
    <div class="form-row"><label>Ora</label><input type="time"></div>
    <div class="form-row"><label>Livello</label>
      <select><option>Principiante</option><option>Intermedio</option><option>Avanzato</option></select>
    </div>
    <div class="form-row"><label>Zona</label><input type="text" placeholder="Es. Pieve di Soligo"></div>
    <button class="action" type="button">CERCA IL MIO MATCH</button>
  </div>
</section>

<section id="games" class="view">
  <button class="back" type="button" onclick="showView('home')">← Torna alla Home</button>
  <h1>Le mie partite</h1>
  <div class="card"><strong>Nessuna partita ancora</strong><p>Quando troverai un compagno, le tue partite compariranno qui.</p></div>
</section>

<section id="profile" class="view">
  <button class="back" type="button" onclick="showView('home')">← Torna alla Home</button>
  <h1>Profilo</h1>
  <div class="card">
    <div class="form-row"><label>Nome</label><input type="text" placeholder="Il tuo nome"></div>
    <div class="form-row"><label>Livello</label>
      <select><option>Principiante</option><option>Intermedio</option><option>Avanzato</option></select>
    </div>
    <button class="action" type="button">SALVA PROFILO</button>
  </div>
</section>

<nav class="bottom-nav">
  <button class="nav-btn active" type="button" data-view="home" onclick="showView('home')">
    <span class="icon">⌂</span><span>Home</span>
  </button>
  <button class="nav-btn" type="button" data-view="games" onclick="showView('games')">
    <span class="icon">▣</span><span>Le mie partite</span>
  </button>
  <button class="nav-btn" type="button" data-view="profile" onclick="showView('profile')">
    <span class="icon">♙</span><span>Profilo</span>
  </button>
</nav>
</div>

<script>
function showView(view){
  document.querySelectorAll('.hero,.view').forEach(el=>el.classList.remove('active'));
  if(view==='home'){
    document.getElementById('home').classList.add('active');
  }else{
    document.getElementById(view).classList.add('active');
  }
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.view===view);
  });
  window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('home').classList.add('active');
</script>
</body>
</html>
