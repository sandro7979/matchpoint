<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b0d">
<title>MatchPoint</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#020b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}button,input,select{font:inherit}
.app{width:100%;height:100dvh;max-width:520px;margin:auto;background:#020b0d;position:relative;overflow:hidden}
.home{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 35%,rgba(2,11,13,.08) 47%,rgba(2,11,13,.92) 73%,#020b0d 88%),url("matchpoint-home.jpg") center top/cover no-repeat}
.brand{position:absolute;left:0;right:0;top:48%;text-align:center;padding:0 18px}
.ball{font-size:43px;line-height:1;margin-bottom:7px}.logo{font-size:clamp(42px,10vw,58px);font-weight:900;letter-spacing:-2px;line-height:1}.logo span{color:#d9ff00}
.tagline{font-size:15px;font-weight:700;letter-spacing:.5px;margin-top:10px}.line{width:62px;height:3px;background:#d9ff00;border-radius:3px;margin:18px auto 34px}
.cta{position:absolute;left:7%;right:7%;top:69%;height:72px;border:0;border-radius:40px;background:#d9ff00;color:#050909;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:18px;cursor:pointer;touch-action:manipulation}
.cta:active,.primary:active,.back:active,.nav button:active,.choice:active{transform:scale(.98)}
.nav{position:absolute;left:0;right:0;bottom:0;height:92px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(2,11,13,.98);border-top:1px solid rgba(255,255,255,.12);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{border:0;background:transparent;color:#cbd0d1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;cursor:pointer;touch-action:manipulation}.nav .ico{font-size:30px;line-height:1}.nav .active{color:#d9ff00}
.view{position:absolute;inset:0;background:#020b0d;overflow:auto;padding:30px 20px 30px;display:none;z-index:10}.view.show{display:block}.view h1{font-size:31px;margin:12px 0 25px}
.back,.primary{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;touch-action:manipulation}.back{background:#172326;color:#fff;margin-bottom:22px}.primary{background:#d9ff00;color:#050909}
.secondary{width:100%;border:1px solid #34484e;border-radius:14px;padding:14px;background:#0b171a;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}
.card{background:#0b171a;border:1px solid #24363b;border-radius:18px;padding:18px;margin:12px 0}label{display:block;font-weight:800;font-size:14px;margin:15px 0 7px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #34484e;background:#081317;color:#fff;font-size:16px}.muted{color:#b9c1c3;line-height:1.45}
.hidden{display:none!important}
.result{display:none}.result.show{display:block}.match-player{font-size:24px;font-weight:900;margin-bottom:5px}.match-meta{color:#d9ff00;font-weight:800;margin-bottom:12px}
.badge{display:inline-block;background:#172326;border:1px solid #34484e;border-radius:20px;padding:7px 11px;margin:3px 3px 0 0;color:#fff;font-size:13px}.success{font-size:18px;font-weight:900;margin-bottom:8px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #30454a;background:#0b171a;color:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer}.choice.selected{border-color:#d9ff00;box-shadow:0 0 0 1px #d9ff00 inset}.choice strong{display:block;margin-bottom:4px}.choice small{color:#aeb7b9}
.loading{text-align:center;padding:30px 10px}.spinner{width:58px;height:58px;border:5px solid #26383d;border-top-color:#d9ff00;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;background:#17272b;border-radius:10px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;width:0;background:#d9ff00;transition:width .4s}
.steps{display:flex;gap:7px;margin-bottom:18px}.steps div{flex:1;text-align:center;font-size:11px;color:#879295;font-weight:800}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#26383d;margin:0 auto 5px}.steps .on{background:#d9ff00;color:#050909}
.game{border:1px solid #30454a;background:#0b171a;border-radius:16px;padding:15px;margin:10px 0}.game-top{display:flex;justify-content:space-between}.status{color:#d9ff00;font-size:12px;font-weight:900}.profile-avatar{width:82px;height:82px;border-radius:50%;background:#d9ff00;color:#050909;display:grid;place-items:center;font-size:34px;font-weight:900;margin:auto}.profile-head{text-align:center;margin-bottom:20px}
.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(20px);background:#d9ff00;color:#050909;font-weight:900;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-height:700px){.brand{top:43%}.cta{top:64%}.nav{height:82px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="home">
