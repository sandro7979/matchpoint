<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b0d">
<title>MatchPoint</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#020b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
.app{width:100%;height:100dvh;max-width:520px;margin:auto;position:relative;background:#020b0d;overflow:hidden}

/* HOME: foto come sfondo, tutti i controlli sono veri elementi HTML */
.home{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,0) 38%,rgba(2,11,13,.08) 48%,rgba(2,11,13,.92) 72%,#020b0d 84%),
    url("matchpoint-home.jpg") center top/cover no-repeat;
}
.brand{
  position:absolute;left:0;right:0;top:49%;
  text-align:center;padding:0 18px;
}
.ball{font-size:45px;line-height:1;margin-bottom:8px}
.logo{font-size:clamp(42px,10vw,58px);font-weight:900;letter-spacing:-2px;line-height:1}
.logo span{color:#d9ff00}
.tagline{font-size:15px;font-weight:700;letter-spacing:.5px;margin-top:10px}
.line{width:62px;height:3px;background:#d9ff00;border-radius:3px;margin:18px auto 28px}

.cta{
  position:absolute;left:7%;right:7%;top:68%;
  height:72px;border:0;border-radius:40px;
  background:#d9ff00;color:#050909;
  font-size:18px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:18px;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.cta:active{transform:scale(.98)}

.nav{
  position:absolute;left:0;right:0;bottom:0;height:92px;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(2,11,13,.97);
  border-top:1px solid rgba(255,255,255,.12);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  border:0;background:transparent;color:#cbd0d1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.nav button:active{background:rgba(217,255,0,.08)}
.nav .ico{font-size:30px;line-height:1}
.nav .active{color:#d9ff00}

/* SCHERMATE INTERNE */
.view{
  position:absolute;inset:0;background:#020b0d;overflow:auto;
  padding:30px 20px 35px;display:none;
}
.view.show{display:block}
.view h1{font-size:31px;margin:12px 0 25px}
.back,.primary{
  width:100%;border:0;border-radius:14px;padding:15px;
  font-size:16px;font-weight:900;cursor:pointer;
  touch-action:manipulation;
}
.back{background:#172326;color:#fff;margin-bottom:22px}
.primary{background:#d9ff00;color:#050909}
.card{background:#0b171a;border:1px solid #24363b;border-radius:18px;padding:18px;margin:12px 0}
label{display:block;font-weight:800;font-size:14px;margin:15px 0 7px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #34484e;background:#081317;color:#fff;font-size:16px}
.muted{color:#b9c1c3;line-height:1.45}
</style>
</head>
<body>
<div class="app">

<section id="home" class="home">
  <div class="brand">
    <div class="ball">🎾</div>
    <div class="logo">MATCH<span>POINT</span></div>
    <div class="tagline">TROVA IL TUO COMPAGNO DI TENNIS</div>
    <div class="line"></div>
  </div>

  <button class="cta" type="button" onclick="openView('match')">
    <span>🎾</span><span>TROVA IL MIO MATCH</span><span>→</span>
  </button>

  <nav class="nav">
    <button type="button" class="active" onclick="openView('home')">
      <span class="ico">⌂</span><span>Home</span>
    </button>
    <button type="button" onclick="openView('games')">
      <span class="ico">▣</span><span>Le mie partite</span>
    </button>
    <button type="button" onclick="openView('profile')">
      <span class="ico">♙</span><span>Profilo</span>
    </button>
  </nav>
</section>

<section id="match" class="view">
  <button class="back" type="button" onclick="openView('home')">← Torna alla Home</button>
  <h1>Trova il mio match</h1>
  <div class="card">
    <label>Quando vuoi giocare?</label><input type="date">
    <label>Orario</label><input type="time" value="18:00">
    <label>Zona</label><input type="text" placeholder="Es. Pieve di Soligo">
    <label>Livello</label>
    <select><option>Principiante</option><option selected>Intermedio</option><option>Avanzato</option></select>
  </div>
  <button class="primary" type="button">CERCA IL MIO MATCH</button>
</section>

<section id="games" class="view">
  <button class="back" type="button" onclick="openView('home')">← Torna alla Home</button>
  <h1>Le mie partite</h1>
  <div class="card">
    <strong>🎾 Nessuna partita ancora</strong>
    <p class="muted">Le partite confermate compariranno qui.</p>
  </div>
</section>

<section id="profile" class="view">
  <button class="back" type="button" onclick="openView('home')">← Torna alla Home</button>
  <h1>Il mio profilo</h1>
  <div class="card">
    <label>Nome</label><input placeholder="Il tuo nome">
    <label>Livello</label>
    <select><option>Principiante</option><option selected>Intermedio</option><option>Avanzato</option></select>
    <label>Zona</label><input placeholder="Pieve di Soligo">
  </div>
  <button class="primary" type="button">SALVA PROFILO</button>
</section>

</div>

<script>
function openView(id){
  const home=document.getElementById('home');
  const views=document.querySelectorAll('.view');
  if(id==='home'){
    views.forEach(v=>v.classList.remove('show'));
    home.style.display='block';
    return;
  }
  home.style.display='none';
  views.forEach(v=>v.classList.remove('show'));
  const target=document.getElementById(id);
  if(target) target.classList.add('show');
}
home.style.display='block';
</script>
</body>
</html>
