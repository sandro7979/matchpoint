<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020b0d">
<title>MatchPoint</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#020b0d;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}
.app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
  background:#020b0d;
}
.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.screen img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  user-select:none;
  -webkit-user-drag:none;
}
.btn{
  position:absolute;
  display:block;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  z-index:10;
}
/* Main CTA: broad invisible hit area over the whole yellow button */
.match{
  left:10%;
  width:80%;
  top:72%;
  height:9%;
  border-radius:999px;
}
/* Bottom navigation: lowered and evenly spaced */
.home{
  left:0;
  width:33.33%;
  bottom:0;
  height:13%;
}
.partite{
  left:33.33%;
  width:33.34%;
  bottom:0;
  height:13%;
}
.profilo{
  right:0;
  width:33.33%;
  bottom:0;
  height:13%;
}
</style>
</head>
<body>
<main class="app">
  <section class="screen" aria-label="MatchPoint Home">
    <img src="matchpoint-home.jpg" alt="MatchPoint - Trova il tuo compagno di tennis">

    <button class="btn match" aria-label="Trova il mio match"
      onclick="apri('match')"></button>

    <button class="btn home" aria-label="Home"
      onclick="apri('home')"></button>

    <button class="btn partite" aria-label="Le mie partite"
      onclick="apri('partite')"></button>

    <button class="btn profilo" aria-label="Profilo"
      onclick="apri('profilo')"></button>
  </section>
</main>

<script>
function apri(sezione){
  /*
    Qui non usiamo pagine inventate: il click viene registrato
    nell'URL così possiamo collegare le sezioni reali della versione
    precedente senza rompere la Home.
  */
  if(sezione === 'home'){
    history.replaceState(null,'',location.pathname);
    return;
  }
  location.hash = sezione;
}
</script>
</body>
</html>
